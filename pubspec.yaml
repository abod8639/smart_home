name: smart_home
description: "A new Flutter project."
publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.12.0


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  web_socket_channel: ^3.0.3
  equatable: ^2.0.8
  lottie: ^3.3.3
  shared_preferences: ^2.5.5
  uuid: ^4.5.3
  get: ^4.7.3
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:


  uses-material-design: true

  assets:
    - assets/images/


