name: smart_home
description: "A new Flutter project."
publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.12.0


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  mqtt_client: ^10.4.1
  equatable: ^2.0.8
  lottie: ^3.3.3
  shared_preferences: ^2.5.5
  uuid: ^4.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2
  flutter_matter:
    git:
      url: https://github.com/abod8639/flutter_matter.git
      ref: main
  jni_flutter: ^1.0.1
  firebase_core: ^4.10.0
  firebase_database: ^12.4.2
  firebase_auth: ^6.5.2
  firebase_messaging: ^16.3.0
  flutter_dotenv: ^6.0.1
  firebase_ai: ^3.12.2
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.3.0
  collection: ^1.19.1
  qr_flutter: ^4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.4
  build_runner: ^2.15.0
  mockito: ^5.6.4
  firebase_auth_mocks: ^0.15.2


flutter:


  uses-material-design: true

  assets:
    - assets/images/
    - .env


